<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ziko Hairstyle - Dashboard</title><link rel="stylesheet" href="style.css"></head><body>
<div class="admin"><h2>Revenue dashboard</h2>
<p><a href="admin.html" style="color:var(--gold)">Bookings</a> &nbsp; <a href="index.html" style="color:var(--gold)">Back to site</a></p>
<div class="card" id="login"><label>Admin password</label><input type="password" id="pw"><br><br><button class="btn" id="ok">Log in</button></div>
<div id="dash" hidden>
<div class="ctl"><div><label>Month</label><input type="month" id="m"></div><div><label>Year</label><input type="number" id="y" min="2020" max="2100"></div></div>
<div class="stats3">
<div class="card"><small id="l1"></small><div class="big" id="v1"></div><small id="c1"></small></div>
<div class="card"><small id="l2"></small><div class="big" id="v2"></div><small id="c2"></small></div>
<div class="card"><small id="l3"></small><div class="big" id="v3"></div><small id="c3"></small></div>
</div>
<h3>Daily revenue (selected month)</h3><div class="card"><div class="bars" id="cd"></div></div>
<h3>Monthly revenue (selected year)</h3><div class="card"><div class="bars" id="cm"></div></div>
<h3>Yearly revenue</h3><div class="card"><div class="bars" id="cy"></div></div>
<h3>By barber</h3><div class="card wrap"><table id="tb"></table></div>
<p style="color:var(--mut);font-size:14px">Revenue counts confirmed bookings by appointment date, including upcoming ones. Cancelled bookings are not counted.</p>
</div></div><script src="dashboard.js"></script></body></html>
